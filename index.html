<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Animal Adventure</title><style> *{box-sizing:border-box}body{font:18px system-ui;background:#eef7f4;color:#183d39;margin:0}main{max-width:650px;margin:auto;padding:20px}section,dialog{background:white;border:0;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 5px 25px #16463a12}button,select,input{font:inherit;border:1px solid #badbd0;border-radius:12px;padding:13px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#176b59;color:white;width:100%}button.option{display:block;width:100%;text-align:left;margin:10px 0}button:disabled{opacity:1}h1{font-size:32px;margin:8px 0}small{color:#52776d}img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f1f6f4;border-radius:14px}#collection{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}dialog{max-width:90vw;width:430px}.settings{text-align:center}.settings button{font-size:15px}.levelbar{padding:18px 22px}.levelbar h1{font-size:clamp(22px,5.5vw,30px);margin:0} dialog::backdrop{background:#123a36aa}#feedback{white-space:pre-line}input{width:100%;margin:12px 0}#levelAnimal{font-size:100px;text-align:center;animation:hop .85s ease-in-out infinite;display:block;margin:25px auto;transform-origin:bottom center}@keyframes hop{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-24px) rotate(8deg)}}@media(prefers-reduced-motion:reduce){#levelAnimal{animation:none}}</style><main><section class="levelbar"><h1 id="levelTitle"></h1></section><section><small id="context"></small><h2 id="question"></h2><button id="listen">🔊 Luister</button> <button id="hint">Vertaling</button><p id="translation" hidden></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" hidden>Next question →</button></section><section><h2>Mijn dieren</h2><div id="collection"></div></section><section class="settings"><button id="reset" type="button">Wis voortgang</button></section></main><dialog id="confirmReset"><h2>Voortgang wissen?</h2><p>Alle voltooide levels, punten en verzamelde dieren worden verwijderd. Dit kun je niet ongedaan maken.</p><button id="cancelReset">Annuleren</button> <button id="doReset">Ja, wis alles</button></dialog><dialog id="reward"><h2>Five in a row! 🎉</h2><h3 id="animal"></h3><img id="photo" alt="Dierenfoto"><button class="primary" id="close">Continue →</button></dialog><dialog id="levelReward"><h2 id="levelHeading">Level complete! 🎉</h2><div id="levelAnimal" role="img"></div><p id="levelMessage"></p><button class="primary" id="levelClose">Let’s go! →</button></dialog><script>
const data=[['Kennismaken','What is your name?|Hoe heet je?|My name is Alex.|I am eleven.|I live in England.~How old are you?|Hoe oud ben je?|I am eleven years old.|My name is Alex.|I like football.~How are you?|Hoe gaat het?|I am fine, thank you.|It is a dog.|I am at school.~Where are you from?|Waar kom je vandaan?|I am from the Netherlands.|I am hungry.|It is Monday.~Nice to meet you!|Leuk je te ontmoeten!|Nice to meet you too!|Good night.|I have a bike.'],['Familie','Do you have a brother?|Heb je een broer?|Yes, I have one brother.|I play tennis.|It is blue.~Who is she?|Wie is zij?|She is my sister.|I am ten.|It is raining.~How many people are in your family?|Uit hoeveel mensen bestaat je gezin?|There are four people.|At seven o’clock.|My favourite food is pizza.'],['Huisdieren','Do you have a pet?|Heb je een huisdier?|Yes, I have a rabbit.|I go to school.|I am thirsty.~What does your dog eat?|Wat eet je hond?|It eats dog food.|It is Tuesday.|I like swimming.~What colour is your cat?|Welke kleur heeft je kat?|It is black and white.|It is under the bed.|It is three years old.'],['Sport','What sport do you like?|Welke sport vind je leuk?|I like football.|I have two sisters.|It is cold.~Can you swim?|Kun je zwemmen?|Yes, I can.|Yes, I am.|Yes, it is.~When do you play tennis?|Wanneer tennis je?|On Saturdays.|At the supermarket.|With a racket.'],['School','What is your favourite subject?|Wat is je lievelingsvak?|I like maths.|I like apples.|I am twelve.~Can I borrow your pencil?|Mag ik je potlood lenen?|Yes, here you are.|I am at home.|It is sunny.~Do you have homework?|Heb je huiswerk?|Yes, I do.|Yes, I am.|Yes, I can.'],['Eten','What would you like to drink?|Wat wil je drinken?|Water, please.|A sandwich, please.|A new book, please.~Are you hungry?|Heb je honger?|Yes, I am.|Yes, I do.|Yes, I can.~What is your favourite food?|Wat is je lievelingseten?|I love pizza.|I love cats.|I love blue.'],['Winkelen','How much is this shirt?|Hoeveel kost dit shirt?|It is ten pounds.|It is Monday.|It is my brother.~Can I help you?|Kan ik je helpen?|Yes, I am looking for shoes.|I am eleven.|I can swim.~What size do you need?|Welke maat heb je nodig?|Size small, please.|Red, please.|Tomorrow, please.'],['Vakantie','Where are you staying?|Waar verblijf je?|At a hotel.|On Friday.|With a suitcase.~How did you get here?|Hoe ben je hier gekomen?|By train.|At noon.|In July.~Do you like the beach?|Vind je het strand leuk?|Yes, I love it.|Yes, I am.|Yes, I can.'],['De weg','Where is the station?|Waar is het station?|Turn left at the corner.|It costs five pounds.|It is Monday.~Is it far?|Is het ver?|No, it is very close.|No, I am not.|No, I do not.~How can I get to the park?|Hoe kom ik bij het park?|Go straight ahead.|I like the park.|It is green.'],['Dagelijks','What time is it?|Hoe laat is het?|It is eight o’clock.|It is Friday.|It is winter.~What are you doing?|Wat ben je aan het doen?|I am reading a book.|I am twelve.|I have a sister.~See you tomorrow!|Tot morgen!|See you tomorrow!|Good morning!|Happy birthday!']];
const animals=["Red panda", "European rabbit", "Golden hamster", "Sea otter", "Koala", "Giant panda", "Red fox", "Meerkat", "Hedgehog", "Capybara", "Alpaca", "Ring-tailed lemur", "Fennec fox", "Emperor penguin", "Harbour seal", "African elephant", "Giraffe", "Snow leopard", "Eurasian red squirrel", "Domestic cat", "Bottlenose dolphin", "Quokka", "Wombat", "Pygmy hippopotamus", "European badger", "Barn owl", "Guinea pig", "Brown rat", "Polar bear", "Orangutan"];const $=x=>document.getElementById(x);const initialState=()=>({points:0,streak:0,earned:[],mastered:{},completed:[]});let state=initialState();try{state={...state,...JSON.parse(localStorage.getItem('english-animal-v1')||'{}')}}catch{}let q,locked=false,last=-1,pendingLevel=null,afterRewardTimer=null,levelTimer=null;
let activeLevel=0, currentIndex=-1, remaining=[],retry=[],answeredThisRound=new Set();
const countQuestions=t=>data[t][1].split('~').length;
function save(){try{localStorage.setItem('english-animal-v1',JSON.stringify(state))}catch{}render()}
function render(){
 $('levelTitle').textContent=`Level ${activeLevel+1} – ${englishLevels[activeLevel]}`;
 $('collection').replaceChildren();
 for(const a of state.earned.filter(a=>animals.includes(a.name))){let b=document.createElement('div');b.textContent=a.name;
 if(a.url){let im=document.createElement('img');im.loading='lazy';im.src=a.url;im.alt=a.name;b.prepend(im)}$('collection').append(b)}
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function prepareLevel(t){
 activeLevel=t;last=-1;currentIndex=-1;
 const mastered=state.mastered[t]||{};
 remaining=shuffle(Array.from({length:countQuestions(t)},(_,i)=>i).filter(i=>!mastered[i]));
 // When replaying a completed level, all questions are offered again.
 if(!remaining.length)remaining=shuffle(Array.from({length:countQuestions(t)},(_,i)=>i));
 retry=[];answeredThisRound=new Set();fresh();render();
}
function fresh(){
 if(!remaining.length){if(retry.length){remaining=retry;retry=[]}else{finishRound();return}}
 currentIndex=remaining.shift();last=currentIndex;
 q=data[activeLevel][1].split('~')[currentIndex].split('|');locked=false;
 $('question').textContent=q[0];$('translation').textContent=q[1];$('translation').hidden=true;
 $('feedback').textContent='';$('next').hidden=true;$('answers').replaceChildren();
 for(const s of shuffle(q.slice(2))){let b=document.createElement('button');b.className='option';b.textContent=s;b.onclick=()=>grade(s);$('answers').append(b)}
}
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,' ')}
function grade(s){
 if(locked)return;locked=true;const ok=norm(s)===norm(q[2]);
 document.querySelectorAll('.option').forEach(b=>{
  b.disabled=true;
  if(norm(b.textContent)===norm(q[2]))b.style.background='#d9f4df';
  else if(!ok&&norm(b.textContent)===norm(s))b.style.background='#f9d9dc';
 });
 $('feedback').textContent=ok?'Great job!':'Try again later!';
 if(ok){
  state.mastered[activeLevel]??={};state.mastered[activeLevel][currentIndex]=true;
  state.points+=10;state.streak++;
 }else{state.streak=0;retry.push(currentIndex)}
 const finished=!remaining.length&&!retry.length;
 if(finished){
  if(!state.completed.includes(activeLevel))state.completed.push(activeLevel);
  pendingLevel=activeLevel;
 }
 $('next').hidden=finished;
 save();
 if(ok&&state.streak>=5){state.streak=0;save();unlock();}
 if(finished&&!$('reward').open)showLevel();
}
function finishRound(){
 // This also handles a previously completed level being replayed.
 if(!state.completed.includes(activeLevel))state.completed.push(activeLevel);
 pendingLevel=activeLevel;save();showLevel();
}
async function unlock(){let pool=animals.filter(n=>!state.earned.some(a=>a.name===n));if(!pool.length)pool=animals;let name=shuffle(pool)[0],a=state.earned.find(a=>a.name===name);if(!a){a={name};state.earned.push(a)}$('animal').textContent=name;$('photo').removeAttribute('src');$('photo').hidden=true;$('reward').showModal();if(pendingLevel!==null){clearTimeout(afterRewardTimer);afterRewardTimer=setTimeout(()=>{if($('reward').open)$('reward').close()},3600)}try{if(!a.url){let u='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=650&titles='+encodeURIComponent(name);let r=await fetch(u);let j=await r.json();let p=Object.values(j.query.pages)[0];a.url=p.thumbnail?.source;a.source='https://en.wikipedia.org/wiki/'+encodeURIComponent(p.title.replaceAll(' ','_'))}if(a.url){$('photo').src=a.url;$('photo').hidden=false;}save()}catch{} }const levelAnimals=['🐰','🐼','🦊','🐨','🐹','🐧','🦦','🐱','🐶','🐀'];
const englishLevels=['Introductions','Family','Pets','Sports','School','Food and Drinks','Shopping','Holidays','Directions','Everyday English'];
let nextLevelAfterCompletion=null;
function nextUncompleted(t){for(let k=1;k<=data.length;k++){let i=(t+k)%data.length;if(!state.completed.includes(i))return i}return 0}
function goToNextLevel(){clearTimeout(levelTimer);if($('levelReward').open)$('levelReward').close();if(nextLevelAfterCompletion!==null){const target=nextLevelAfterCompletion;nextLevelAfterCompletion=null;prepareLevel(target)}}
function showLevel(){if(pendingLevel===null||$('reward').open)return;let t=pendingLevel;pendingLevel=null;let nxt=nextUncompleted(t);nextLevelAfterCompletion=nxt;
$('levelAnimal').textContent=levelAnimals[t];
$('levelHeading').textContent=`Level ${t+1} – ${englishLevels[t]} complete! 🎉`;
$('levelMessage').textContent=`Great job! On to Level ${nxt+1} – ${englishLevels[nxt]}!`;
$('levelReward').showModal();clearTimeout(levelTimer);levelTimer=setTimeout(goToNextLevel,4000)}
$('reward').addEventListener('close',()=>{clearTimeout(afterRewardTimer);setTimeout(showLevel,450)});
$('close').onclick=()=>$('reward').close();$('levelClose').onclick=goToNextLevel;
$('photo').onerror=()=>{$('photo').hidden=true};$('listen').onclick=()=>{if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(q[0]);u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}};$('hint').onclick=()=>$('translation').hidden=!$('translation').hidden;$('next').onclick=()=>{if(pendingLevel===null&&!$('levelReward').open&&!$('reward').open)fresh()};$('reset').onclick=()=>$('confirmReset').showModal();$('cancelReset').onclick=()=>$('confirmReset').close();$('doReset').onclick=()=>{clearTimeout(afterRewardTimer);clearTimeout(levelTimer);for(const id of ['reward','levelReward','confirmReset'])if($(id).open)$(id).close();state=initialState();pendingLevel=null;nextLevelAfterCompletion=null;last=-1;save();prepareLevel(0)};prepareLevel(state.completed.length===data.length?0:(Array.from({length:data.length},(_,i)=>i).find(i=>!state.completed.includes(i))??0));</script></html>
